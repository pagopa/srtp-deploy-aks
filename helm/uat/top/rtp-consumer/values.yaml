microservice-chart:
  namespace: "srtp"

  image:
    repository: ghcr.io/pagopa/rtp-consumer
    tag: snapshot-main
    pullPolicy: Always

  ingress:
    host: "srtp.itn.internal.uat.cstar.pagopa.it"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  autoscaling:
    enable: true
    minReplica: 4
    maxReplica: 6
    pollingInterval: 30 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metadata:
          type: Utilization
          value: "60"

  envConfig:
    PROCESS_GPD_MESSAGE_BASE_URL: "https://api-rtp.uat.cstar.pagopa.it/rtp"
    PROCESS_GPD_MESSAGE_TIMEOUT: "PT30S"
    PROCESS_GPD_MESSAGE_MAX_CONNECTIONS: "500"
    PROCESS_GPD_MESSAGE_PENDING_QUEUE: "1000"
    PROCESS_GPD_MESSAGE_PENDING_TIMEOUT: "PT45S"
    MIL_AUTH_TOKEN_URL: "https://api-mcshared.uat.cstar.pagopa.it/auth-itn/realms/srtp/protocol/openid-connect/token"
    GPD_EVENTHUB_NAME: "pagopa-u-itn-gps-rtp-integration-evh"
    GPD_EVENTHUB_TOPIC: "rtp-events"
    GPD_EVENTHUB_CONSUMER_GROUP: "rtp-events-processor"
    GPD_MESSAGE_PROCESSING_ENABLED: "true"
    COSMOSDB_RETRY_MAX_ATTEMPTS: "3"
    COSMOSDB_RETRY_BACKOFF_MIN_DURATION: "PT1S"
    COSMOSDB_RETRY_BACKOFF_JITTER: "0.75"

  keyvault:
    name: "cstar-u-itn-srtp-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
