microservice-chart:
  namespace: "srtp"

  deployment:
    # Keep the IP in sync with the upstream endpoint if it changes.
    hostAliases:
      - ip: "20.31.11.237"
        hostnames:
          - "api-rtp.uat.cstar.pagopa.it"

  image:
    repository: ghcr.io/pagopa/rtp-payees
    tag: snapshot-main
    pullPolicy: Always

  ingress:
    host: "srtp.itn.internal.uat.cstar.pagopa.it"

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

  autoscaling:
    enable: false
#    minReplica: 1
#    maxReplica: 3
#    pollingInterval: 30
#    cooldownPeriod: 300
#    triggers:
#      - type: cpu
#        metadata:
#          type: Utilization
#          value: "60"

  envConfig:
    BASE_URL: "https://api-rtp.uat.cstar.pagopa.it/rtp/payees/"
    BACKOFFICE_BASE_URL: "https://api.uat.platform.pagopa.it/backoffice/pagopa/services/v1"

  keyvault:
    name: "cstar-u-itn-srtp-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"

postman-test:
  run: true
  repoName: rtp-payees
  dir: postman
  collectionName: "rtp-payees-E2E.postman_collection.json"
  envVariablesFile: "rtp_uat.postman_environment.json" #inside azdo secure files
