microservice-chart:
  namespace: "srtp"

  deployment:
    # Keep the IP in sync with the upstream endpoint if it changes.
    hostAliases:
      - ip: "20.31.11.237"
        hostnames:
          - "api-rtp.uat.cstar.pagopa.it"
      - ip: "10.20.0.84"
        hostnames:
          - "cstar-u-itn-srtp-cosmos-account.mongo.cosmos.azure.com"

  image:
    repository: ghcr.io/pagopa/rtp-registry
    tag: snapshot-main
    pullPolicy: Always

  ingress:
    host: "srtp.itn.internal.uat.cstar.pagopa.it"

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

  autoscaling:
    enable: false
#    minReplica: 1
#    maxReplica: 3
#    pollingInterval: 30
#    cooldownPeriod: 300
#    triggers:
#      - type: cpu
#        metadata:
#          type: Utilization
#          value: "60"

  envConfig:
    MONGODB_RETRY_MAX_ATTEMPTS: "3"
    MONGODB_RETRY_INITIAL_BACKOFF: "PT0.2S"
    MONGODB_RETRY_MAX_BACKOFF: "PT2S"
    MONGODB_RETRY_JITTER: "0"
    BASE_URL: "https://api-rtp.uat.cstar.pagopa.it/rtp/registry/"
    BACKOFFICE_BASE_URL: "https://api.uat.platform.pagopa.it/backoffice/pagopa/services/v1"
    APPLICATIONINSIGHTS_EXPORTER_MAX_CONNECTIONS: "50"
    APPLICATIONINSIGHTS_EXPORTER_MAX_IDLE_TIME: "PT15S"
    APPLICATIONINSIGHTS_EXPORTER_MAX_LIFE_TIME: "PT55S"
    APPLICATIONINSIGHTS_EXPORTER_EVICT_IN_BACKGROUND: "PT10S"

  keyvault:
    name: "cstar-u-itn-srtp-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"

postman-test:
  run: true
  repoName: rtp-registry
  dir: postman
  collectionName: "rtp-registry-E2E.postman_collection.json"
  envVariablesFile: "rtp_uat.postman_environment.json" #inside azdo secure files
