microservice-chart:
  namespace: "srtp"

  deployment:
    # Keep the IP in sync with the upstream endpoint if it changes.
    hostAliases:
      - ip: "20.71.68.43"
        hostnames:
          - "api-mcshared.dev.cstar.pagopa.it"
          - "api-rtp.dev.cstar.pagopa.it"
      - ip: "4.232.26.70"
        hostnames:
          - "cstar-d-itn-srtp-cosmos-account.mongo.cosmos.azure.com"

  image:
    repository: ghcr.io/pagopa/rtp-sender-v2
    tag: snapshot-main
    pullPolicy: Always

  ingress:
    host: "srtp.itn.internal.dev.cstar.pagopa.it"

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

  autoscaling:
    enable: false
#    minReplica: 1
#    maxReplica: 3
#    pollingInterval: 30 # seconds
#    cooldownPeriod: 300 # seconds
#    triggers:
#      - type: cpu
#        metadata:
#          type: Utilization
#          value: "60"

  envConfig:
    BASE_URL: "https://api-rtp.dev.cstar.pagopa.it/rtp/activation/"
    SP_BASE_URL: "https://api-rtp.dev.cstar.pagopa.it/rtp/rtps/"
    PAYEES_REGISTRY_BASE_URL: "https://api-rtp.dev.cstar.pagopa.it/rtp/payees/"
    EPC_MOCK_URL: "https://api-rtp.dev.cstar.pagopa.it/rtp/mock"
    AZURE_STORAGE_ACCOUNT_NAME: "cstarditnsrtpsa"
    CALLBACK_BASE_URL: "https://api-rtp-cb.dev.cstar.pagopa.it/rtp/cb/v2"
    GPD_EVENTHUB_NAME: "pagopa-d-itn-gps-rtp-integration-evh"
    GPD_EVENTHUB_TOPIC: "rtp-events"
    GPD_EVENTHUB_CONSUMER_GROUP: "rtp-events-processor"
    REGISTRY_DATA_CACHE_TTL: "PT5M"
    PAYEES_REGISTRY_DATA_CACHE_TTL: "PT5M"
    MIL_AUTH_TOKEN_URL: "https://api-mcshared.dev.cstar.pagopa.it/auth-itn/realms/srtp/protocol/openid-connect/token"
    FEATURE_TOGGLE_ENABLE_LAST_PROCESSED_TIMESTAMP: "false"
    IDEMPOTENCY_TTL: "PT5M"
    ADX_CLUSTER_URL: "https://cstar-d-itn-platform.italynorth.kusto.windows.net"
    ADX_INGEST_CLUSTER_URL: "https://ingest-cstar-d-itn-platform.italynorth.kusto.windows.net"

  sidecars:
    - name: epc-proxy-sidecar
      image: ghcr.io/pagopa/rtp-sender-v2-sidecar:snapshot-main
      imagePullPolicy: Always
      ports:
        - containerPort: 3000
          name: proxy-http
      env:
        - name: PORT
          value: "3000"
        - name: EPC_BASE_URL
          value: "https://api-rtp.dev.cstar.pagopa.it/rtp/mock"
        - name: EPC_TIMEOUT_MS
          value: "10000"
        - name: RETRY_MAX_ATTEMPTS
          value: "3"
        - name: RETRY_BASE_DELAY_MS
          value: "1000"
        - name: CLIENT_CERTIFICATE
          valueFrom:
            secretKeyRef:
              name: rtp-sender-v2-microservice-chart
              key: client-certificate
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: rtp-sender-v2-microservice-chart
              key: appinsights-connection-string

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - all

  keyvault:
    name: "cstar-d-itn-srtp-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"

  azureFile:
    create: true
    mounts:
      - shareName: cstar-d-itn-srtp-jks-file-share
        name: share-volume
        readOnly: true

  # nodeSelector: {}

  # tolerations: []

  # affinity: {}
