name: Java4Shell check

on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image to inspect
        required: false
        default: ghcr.io/pagopa/rtp-registry:snapshot-main
      runner:
        description: Runner label (use a self-hosted runner with a known AVX-512 VBMI CPU for conclusive results)
        required: false
        default: ubuntu-latest
  push:
    branches:
      - SRTP-2498-fix-java-cve
    paths:
      - .github/workflows/java4shell-check.yml
      - .github/actions/java4shell-check/**

permissions:
  contents: read
  packages: read

jobs:
  java4shell-check:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/java4shell-check
        with:
          image: ${{ inputs.image || 'ghcr.io/pagopa/rtp-registry:snapshot-main' }}
