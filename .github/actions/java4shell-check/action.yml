name: Java4Shell check
description: Checks whether the GraalVM toolchain Base64 decoder and a container image binary are affected by CVE-2026-114938.

inputs:
  image:
    description: Container image to inspect, e.g. ghcr.io/pagopa/rtp-registry:snapshot-main
    required: true
  builder-image:
    description: GraalVM image used to run and native-compile the PoC
    required: false
    default: ghcr.io/graalvm/graalvm-community:21.0.2-ol9-20240116@sha256:6e46c711c90bdbc24e23ccdb6e3fba837d660e68dd4ffeb87abbd3d08e115653

runs:
  using: composite
  steps:
    - name: Check CPU flags required by the trigger
      id: cpu
      shell: bash
      run: |
        flags=$(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n')
        affected=true
        for f in avx512f avx512bw avx512vbmi bmi2; do
          if echo "$flags" | grep -qx "$f"; then
            echo "$f: yes"
          else
            echo "$f: no"
            affected=false
          fi
        done
        echo "cpu_affected=$affected" >> "$GITHUB_OUTPUT"

    - name: Control run on JVM (validates the harness)
      shell: bash
      continue-on-error: true
      env:
        BUILDER: ${{ inputs.builder-image }}
      run: |
        docker run --rm -v "$GITHUB_ACTION_PATH:/poc:ro" --entrypoint java "$BUILDER" /poc/Base64Trigger.java

    - name: Native-compile the PoC and run it
      shell: bash
      env:
        BUILDER: ${{ inputs.builder-image }}
        CPU_AFFECTED: ${{ steps.cpu.outputs.cpu_affected }}
      run: |
        set +e
        out=$(docker run --rm -v "$GITHUB_ACTION_PATH:/poc:ro" --entrypoint sh "$BUILDER" -c '
          set -e
          mkdir -p /tmp/out
          javac -d /tmp/out /poc/Base64Trigger.java
          native-image -cp /tmp/out Base64Trigger -o /tmp/out/trigger
          /tmp/out/trigger
        ' 2>&1)
        rc=$?
        set -e
        echo "$out"
        if echo "$out" | grep -qx 'REPRODUCED'; then
          echo "::error::Native toolchain reproduces CVE-2026-114938"
          exit 1
        fi
        if echo "$out" | grep -qx 'NOT REPRODUCED' && [ "$CPU_AFFECTED" = "true" ]; then
          echo "Native toolchain does not reproduce CVE-2026-114938 on this CPU"
          exit 0
        fi
        echo "::warning::Inconclusive: CPU lacks AVX-512 VBMI or the PoC did not complete (exit $rc)"
        exit 2

    - name: Inspect target image binary
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker pull "$IMAGE"
        cid=$(docker create "$IMAGE")
        docker cp "$cid:/work/application" "$RUNNER_TEMP/application"
        docker rm "$cid" >/dev/null
        echo "HotSpot/libjvm markers in /work/application: $(strings "$RUNNER_TEMP/application" | grep -c -i -E 'hotspot|libjvm' || true)"
