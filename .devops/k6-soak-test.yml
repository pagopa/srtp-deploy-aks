trigger: none
pr: none

# "soak_test" k6 load profile: a constant, moderate request rate held for an
# extended period (k6 constant-arrival-rate executor), meant to surface slow
# leaks/degradation over time. See buildSoakTestScenario() in rtp-platform-qa's
# performance-tests/utils/utils.js for the exact mechanics.

parameters:
  - name: ENV
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - uat

  - name: TESTS_BRANCH
    displayName: rtp-platform-qa branch
    type: string
    default: main

  - name: TEST_TARGET
    displayName: Endpoint to test
    type: string
    default: activation
    values:
      - activation
      # Add more values here (+ a matching job block below) as new k6 test
      # scripts get wired into this pipeline.

  - name: SOAK_RATE
    displayName: 'Constant rate (req/s)'
    type: string
    default: '20'

  - name: SOAK_DURATION
    displayName: 'Total duration, e.g. 5m'
    type: string
    default: '5m'

  - name: SEED_DATA
    displayName: Seed activation data before running the test
    type: boolean
    default: false

  - name: TARGET_REQUESTS
    displayName: Number of activations to seed (only used when SEED_DATA=true)
    type: string
    default: '2000'

variables:
  - ${{ if eq(parameters.ENV, 'dev') }}:
      - name: agentPoolName
        value: $(DEV_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(DEV_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(DEV_POSTMAN_KV_NAME)
  - ${{ if eq(parameters.ENV, 'uat') }}:
      - name: agentPoolName
        value: $(UAT_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(UAT_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(UAT_POSTMAN_KV_NAME)

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: rtpPlatformQa
      type: github
      name: pagopa/rtp-platform-qa
      ref: ${{ parameters.TESTS_BRANCH }}
      endpoint: 'srtp-bot-github-ro'

name: 'k6 soak test - ${{ parameters.ENV }} - $(Date:yyyyMMdd).$(Rev:r)'

stages:
  - stage: run_k6_soak_test
    displayName: '⚡ k6 soak test (${{ parameters.ENV }})'
    jobs:
      # NOTE: appCategory/testScript/seedScript are resolved at compile-time
      # (used to build job identifiers), so TEST_TARGET must be branched here
      # with a literal per-value job block rather than a shared variable.
      - ${{ if eq(parameters.TEST_TARGET, 'activation') }}:
          - template: templates/k6-tests-template.yml
            parameters:
              appsList: ['rtp-activator']
              appCategory: 'activation'
              env: ${{ parameters.ENV }}
              agentPoolName: $(agentPoolName)
              azureServiceConnection: $(azureServiceConnectionName)
              keyVaultName: $(keyVaultName)
              secretName: 'k6-performance-env'
              testsBranch: ${{ parameters.TESTS_BRANCH }}
              testScript: 'activation-finder.js'
              scenario: 'soak_test'
              soakRate: ${{ parameters.SOAK_RATE }}
              soakDuration: ${{ parameters.SOAK_DURATION }}
              seedData: ${{ parameters.SEED_DATA }}
              seedScript: 'create-activations.js'
              targetRequests: ${{ parameters.TARGET_REQUESTS }}
      # Add more ${{ if eq(parameters.TEST_TARGET, '...') }} blocks here for
      # future endpoints (deactivation, callback, ...), each pointing to its
      # own testScript/seedScript/appCategory.
