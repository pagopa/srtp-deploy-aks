trigger: none
pr: none

# "stress_test" k6 load profile: a staircase ramp from a start rate up to a
# peak rate (k6 ramping-arrival-rate executor), meant to find the system's
# breaking point. See buildStressTestScenario() in rtp-platform-qa's
# performance-tests/utils/utils.js for the exact mechanics.

parameters:
  - name: ENV
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - uat

  - name: TESTS_BRANCH
    displayName: rtp-platform-qa branch
    type: string
    default: main

  - name: TEST_TARGET
    displayName: Endpoint to test
    type: string
    default: activation
    values:
      - activation
      - deactivation
      - get_activation
      - get_by_fiscal_code
      - takeover
      - callback
      - gpd_message
      # Add more values here (+ a matching job block below) as new k6 test
      # scripts get wired into this pipeline.

  - name: RAMP_START_RATE
    displayName: 'Start rate (req/s) - tune down for dev, up for uat/prod-like'
    type: string
    default: '2'

  - name: RAMP_PEAK_RATE
    displayName: 'Peak rate (req/s) - tune down for dev, up for uat/prod-like'
    type: string
    default: '50'

  - name: RAMP_STEPS
    displayName: 'Number of staircase steps'
    type: string
    default: '10'

  - name: RAMP_STEP_DURATION
    displayName: 'Duration held at each step, e.g. 30s'
    type: string
    default: '20s'

  - name: SEED_DATA
    displayName: Seed activation data before running the test
    type: boolean
    default: false

  - name: TARGET_REQUESTS
    displayName: Number of activations to seed (only used when SEED_DATA=true)
    type: string
    default: '2000'

  - name: GPD_OPERATION
    displayName: GPD message operation (only used when TEST_TARGET=gpd_message)
    type: string
    default: CREATE
    values:
      - CREATE
      - UPDATE
      - DELETE

  - name: GPD_STATUS
    displayName: GPD message status (only used when TEST_TARGET=gpd_message)
    type: string
    default: VALID
    values:
      - VALID
      - PAID
      - EXPIRED
      - INVALID
      - DRAFT

  - name: GPD_PSP_TAX_CODE
    displayName: GPD message PSP tax code, required for UPDATE PAID ('none' = not set; only used when TEST_TARGET=gpd_message)
    type: string
    default: none

variables:
  - ${{ if eq(parameters.ENV, 'dev') }}:
      - name: agentPoolName
        value: $(DEV_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(DEV_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(DEV_POSTMAN_KV_NAME)
  - ${{ if eq(parameters.ENV, 'uat') }}:
      - name: agentPoolName
        value: $(UAT_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(UAT_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(UAT_POSTMAN_KV_NAME)

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: rtpPlatformQa
      type: github
      name: pagopa/rtp-platform-qa
      ref: ${{ parameters.TESTS_BRANCH }}
      endpoint: 'srtp-bot-github-ro'

name: 'k6 stress test - ${{ parameters.ENV }} - $(Date:yyyyMMdd).$(Rev:r)'

stages:
  - stage: run_k6_stress_test
    displayName: '⚡ k6 stress test (${{ parameters.ENV }})'
    jobs:
      - ${{ if eq(parameters.TEST_TARGET, 'activation') }}:
          - template: templates/targets/k6-activation-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}

      - ${{ if eq(parameters.TEST_TARGET, 'deactivation') }}:
          - template: templates/targets/k6-deactivation-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}

      - ${{ if eq(parameters.TEST_TARGET, 'get_activation') }}:
          - template: templates/targets/k6-get-activation-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}

      - ${{ if eq(parameters.TEST_TARGET, 'get_by_fiscal_code') }}:
          - template: templates/targets/k6-get-by-fiscal-code-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}

      - ${{ if eq(parameters.TEST_TARGET, 'takeover') }}:
          - template: templates/targets/k6-takeover-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}

      - ${{ if eq(parameters.TEST_TARGET, 'callback') }}:
          - template: templates/targets/k6-callback-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                seedData: true
                targetRequests: ${{ parameters.TARGET_REQUESTS }}

      - ${{ if eq(parameters.TEST_TARGET, 'gpd_message') }}:
          - template: templates/targets/k6-gpd-message-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'stress_test'
                rampStartRate: ${{ parameters.RAMP_START_RATE }}
                rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
                rampSteps: ${{ parameters.RAMP_STEPS }}
                rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
                # Operations on existing messages (anything but CREATE/UPDATE
                # with status VALID) need the operation IDs generated by the
                # seed script, so seeding is forced for them.
                seedData: ${{ or(parameters.SEED_DATA, not(and(in(parameters.GPD_OPERATION, 'CREATE', 'UPDATE'), eq(parameters.GPD_STATUS, 'VALID')))) }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                # Passed to both the seed and the test scripts, so the messages
                # are created and then updated with the same PSP tax code.
                extraEnv:
                  OPERATION: ${{ parameters.GPD_OPERATION }}
                  STATUS: ${{ parameters.GPD_STATUS }}
                  ${{ if ne(parameters.GPD_PSP_TAX_CODE, 'none') }}:
                    PSP_TAX_CODE: ${{ parameters.GPD_PSP_TAX_CODE }}
      # Add more ${{ if eq(parameters.TEST_TARGET, '...') }} blocks here for
      # future endpoints, referencing their target template.
