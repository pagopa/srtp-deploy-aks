trigger: none
pr: none

# "spike_test" k6 load profile: a baseline rate, a sudden burst to a peak
# rate, held briefly, then back to baseline (k6 ramping-arrival-rate
# executor), meant to test recovery behavior. See buildSpikeTestScenario() in
# rtp-platform-qa's performance-tests/utils/utils.js for the exact mechanics.

parameters:
  - name: ENV
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - uat

  - name: TESTS_BRANCH
    displayName: rtp-platform-qa branch
    type: string
    default: main

  - name: TEST_TARGET
    displayName: Endpoint to test
    type: string
    default: activation
    values:
      - activation
      - activation_flow
      - deactivation
      - get_activation
      - get_by_fiscal_code
      - takeover
      - callback
      - callback_cancel
      - gpd_message
      - delivery_status
      # Add more values here (+ a matching job block below) as new k6 test
      # scripts get wired into this pipeline.

  - name: SPIKE_BASE_RATE
    displayName: 'Baseline rate (req/s) - tune down for dev, up for uat/prod-like'
    type: string
    default: '2'

  - name: SPIKE_PEAK_RATE
    displayName: 'Peak rate during the burst (req/s) - tune down for dev, up for uat/prod-like'
    type: string
    default: '15'

  - name: SPIKE_RAMP_DURATION
    displayName: 'Ramp up/down duration, e.g. 10s'
    type: string
    default: '10s'

  - name: SPIKE_HOLD_DURATION
    displayName: 'Duration held at peak, e.g. 30s'
    type: string
    default: '15s'

  - name: SEED_DATA
    displayName: Seed data before running the test
    type: boolean
    default: false

  - name: TARGET_REQUESTS
    displayName: Number of records to seed (only used when SEED_DATA=true)
    type: string
    default: '2000'

  - name: BATCH_SIZE
    displayName: Seed requests per batch ('default' = seed script default)
    type: string
    default: default

  - name: SEED_COOLDOWN
    displayName: Pause in seconds between seeding and the test, to let the service cool down (0 = no pause)
    type: string
    default: '0'

  - name: GPD_OPERATION
    displayName: GPD message operation
    type: string
    default: CREATE
    values:
      - CREATE
      - UPDATE
      - DELETE

  - name: GPD_STATUS
    displayName: GPD message status
    type: string
    default: VALID
    values:
      - VALID
      - PAID
      - EXPIRED
      - INVALID
      - DRAFT

  - name: GPD_PSP_TAX_CODE
    displayName: GPD message PSP tax code, required for UPDATE PAID
    type: string
    default: none

variables:
  - ${{ if eq(parameters.ENV, 'dev') }}:
      - name: agentPoolName
        value: $(DEV_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(DEV_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(DEV_POSTMAN_KV_NAME)
  - ${{ if eq(parameters.ENV, 'uat') }}:
      - name: agentPoolName
        value: $(UAT_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(UAT_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(UAT_POSTMAN_KV_NAME)

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: rtpPlatformQa
      type: github
      name: pagopa/rtp-platform-qa
      ref: ${{ parameters.TESTS_BRANCH }}
      endpoint: 'srtp-bot-github-ro'

name: 'k6 spike test - ${{ parameters.ENV }} - $(Date:yyyyMMdd).$(Rev:r)'

stages:
  - stage: run_k6_spike_test
    displayName: '⚡ k6 spike test (${{ parameters.ENV }})'
    jobs:
      - ${{ if eq(parameters.TEST_TARGET, 'activation') }}:
          - template: templates/targets/k6-activation-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if or(eq(parameters.TEST_TARGET, 'activation_flow'), eq(parameters.TEST_TARGET, 'activation-flow')) }}:
          - template: templates/targets/k6-activation-flow-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if eq(parameters.TEST_TARGET, 'deactivation') }}:
          - template: templates/targets/k6-deactivation-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if eq(parameters.TEST_TARGET, 'get_activation') }}:
          - template: templates/targets/k6-get-activation-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if eq(parameters.TEST_TARGET, 'get_by_fiscal_code') }}:
          - template: templates/targets/k6-get-by-fiscal-code-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if eq(parameters.TEST_TARGET, 'takeover') }}:
          - template: templates/targets/k6-takeover-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if eq(parameters.TEST_TARGET, 'callback') }}:
          - template: templates/targets/k6-callback-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: true
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if or(eq(parameters.TEST_TARGET, 'callback_cancel'), eq(parameters.TEST_TARGET, 'callback-cancel')) }}:
          - template: templates/targets/k6-callback-cancel-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: true
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}

      - ${{ if eq(parameters.TEST_TARGET, 'gpd_message') }}:
          - template: templates/targets/k6-gpd-message-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ or(parameters.SEED_DATA, not(and(in(parameters.GPD_OPERATION, 'CREATE', 'UPDATE'), eq(parameters.GPD_STATUS, 'VALID')))) }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}
                extraEnv:
                  OPERATION: ${{ parameters.GPD_OPERATION }}
                  STATUS: ${{ parameters.GPD_STATUS }}
                  ${{ if ne(parameters.GPD_PSP_TAX_CODE, 'none') }}:
                    PSP_TAX_CODE: ${{ parameters.GPD_PSP_TAX_CODE }}

      - ${{ if or(eq(parameters.TEST_TARGET, 'delivery_status'), eq(parameters.TEST_TARGET, 'delivery-status')) }}:
          - template: templates/targets/k6-delivery-status-job.yml
            parameters:
              params:
                env: ${{ parameters.ENV }}
                agentPoolName: $(agentPoolName)
                azureServiceConnection: $(azureServiceConnectionName)
                keyVaultName: $(keyVaultName)
                testsBranch: ${{ parameters.TESTS_BRANCH }}
                scenario: 'spike_test'
                spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
                spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
                spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
                spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
                seedData: ${{ parameters.SEED_DATA }}
                targetRequests: ${{ parameters.TARGET_REQUESTS }}
                seedBatchSize: ${{ parameters.BATCH_SIZE }}
                seedCooldown: ${{ parameters.SEED_COOLDOWN }}
      # Add more ${{ if eq(parameters.TEST_TARGET, '...') }} blocks here for
      # future endpoints, referencing their target template.
