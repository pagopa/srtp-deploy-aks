trigger: none
pr: none

parameters:
  - name: ENV
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - uat

  - name: TESTS_BRANCH
    displayName: rtp-platform-qa branch
    type: string
    default: main

  - name: SCENARIO
    displayName: Load profile
    type: string
    default: custom
    values:
      - custom
      - stress_test
      - soak_test
      - spike_test
      - stress_test_fixed_user
      - soak_test_fixed_user
      - spike_test_fixed_user

  - name: VU_COUNT
    displayName: Virtual Users (only used when SCENARIO=custom)
    type: string
    default: '10'

  - name: ITERATIONS
    displayName: Total iterations (only used when SCENARIO=custom)
    type: string
    default: '500'

  - name: SLEEP_ITER
    displayName: Sleep between iterations (s)
    type: string
    default: '0'

  - name: RAMP_START_RATE
    displayName: 'stress_test: start rate (req/s, only used when SCENARIO=stress_test)'
    type: string
    default: '10'

  - name: RAMP_PEAK_RATE
    displayName: 'stress_test: peak rate (req/s, only used when SCENARIO=stress_test)'
    type: string
    default: '5000'

  - name: RAMP_STEPS
    displayName: 'stress_test: number of staircase steps (only used when SCENARIO=stress_test)'
    type: string
    default: '10'

  - name: RAMP_STEP_DURATION
    displayName: 'stress_test: duration held at each step, e.g. 30s (only used when SCENARIO=stress_test)'
    type: string
    default: '30s'

  - name: SOAK_RATE
    displayName: 'soak_test: constant rate (req/s, only used when SCENARIO=soak_test)'
    type: string
    default: '20'

  - name: SOAK_DURATION
    displayName: 'soak_test: total duration, e.g. 5m (only used when SCENARIO=soak_test)'
    type: string
    default: '5m'

  - name: SPIKE_BASE_RATE
    displayName: 'spike_test: baseline rate (req/s, only used when SCENARIO=spike_test)'
    type: string
    default: '10'

  - name: SPIKE_PEAK_RATE
    displayName: 'spike_test: peak rate during the burst (req/s, only used when SCENARIO=spike_test)'
    type: string
    default: '300'

  - name: SPIKE_RAMP_DURATION
    displayName: 'spike_test: ramp up/down duration, e.g. 10s (only used when SCENARIO=spike_test)'
    type: string
    default: '10s'

  - name: SPIKE_HOLD_DURATION
    displayName: 'spike_test: duration held at peak, e.g. 30s (only used when SCENARIO=spike_test)'
    type: string
    default: '30s'

  - name: SEED_DATA
    displayName: Seed activation data before running the test
    type: boolean
    default: false

  - name: TARGET_REQUESTS
    displayName: Number of activations to seed (only used when SEED_DATA=true)
    type: string
    default: '2000'

variables:
  - ${{ if eq(parameters.ENV, 'dev') }}:
      - name: agentPoolName
        value: $(DEV_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(DEV_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(DEV_POSTMAN_KV_NAME)
  - ${{ if eq(parameters.ENV, 'uat') }}:
      - name: agentPoolName
        value: $(UAT_AGENT_POOL)
      - name: azureServiceConnectionName
        value: $(UAT_AZURE_SERVICE_CONNECTION_NAME)
      - name: keyVaultName
        value: $(UAT_POSTMAN_KV_NAME)

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: rtpPlatformQa
      type: github
      name: pagopa/rtp-platform-qa
      ref: ${{ parameters.TESTS_BRANCH }}
      endpoint: 'srtp-bot-github-ro'

name: 'k6 activation test - ${{ parameters.ENV }} - $(Date:yyyyMMdd).$(Rev:r)'

stages:
  - stage: run_k6_activation_test
    displayName: '⚡ k6 activation test (${{ parameters.ENV }})'
    jobs:
      - template: templates/k6-tests-template.yml
        parameters:
          appsList: ['rtp-activator']
          appCategory: 'activation'
          env: ${{ parameters.ENV }}
          agentPoolName: $(agentPoolName)
          azureServiceConnection: $(azureServiceConnectionName)
          keyVaultName: $(keyVaultName)
          secretName: 'k6-performance-env'
          testsBranch: ${{ parameters.TESTS_BRANCH }}
          testScript: 'activation-finder.js'
          scenario: ${{ parameters.SCENARIO }}
          vuCount: ${{ parameters.VU_COUNT }}
          iterations: ${{ parameters.ITERATIONS }}
          sleepIter: ${{ parameters.SLEEP_ITER }}
          rampStartRate: ${{ parameters.RAMP_START_RATE }}
          rampPeakRate: ${{ parameters.RAMP_PEAK_RATE }}
          rampSteps: ${{ parameters.RAMP_STEPS }}
          rampStepDuration: ${{ parameters.RAMP_STEP_DURATION }}
          soakRate: ${{ parameters.SOAK_RATE }}
          soakDuration: ${{ parameters.SOAK_DURATION }}
          spikeBaseRate: ${{ parameters.SPIKE_BASE_RATE }}
          spikePeakRate: ${{ parameters.SPIKE_PEAK_RATE }}
          spikeRampDuration: ${{ parameters.SPIKE_RAMP_DURATION }}
          spikeHoldDuration: ${{ parameters.SPIKE_HOLD_DURATION }}
          seedData: ${{ parameters.SEED_DATA }}
          seedScript: 'create-activations.js'
          targetRequests: ${{ parameters.TARGET_REQUESTS }}
