parameters:
  - name: appsList
    displayName: 'Applications List'
    type: object
    default: []

  - name: env
    displayName: 'Target Environment'
    type: string

  - name: agentPoolName
    displayName: 'Agent Pool Name'
    type: string

  - name: appCategory
    displayName: 'App Category Identifier'
    type: string
    default: 'top'

  - name: dependsOn
    displayName: 'Dependent Job'
    type: string
    default: ''

  - name: testsBranch
    displayName: 'rtp-platform-qa Branch'
    type: string
    default: 'main'

  - name: testScript
    displayName: 'k6 test script (relative to performance-tests/tests/<appName>/)'
    type: string

  - name: scenario
    displayName: 'k6 SCENARIO env var (custom | stress_test | soak_test | spike_test | *_fixed_user)'
    type: string
    default: 'custom'

  - name: vuCount
    displayName: 'Virtual Users'
    type: number
    default: 10

  - name: iterations
    displayName: 'Total iterations'
    type: number
    default: 30000

  - name: sleepIter
    displayName: 'Sleep between iterations (s)'
    type: number
    default: 0

  - name: rampStartRate
    displayName: 'stress_test: start rate (req/s)'
    type: number
    default: 10

  - name: rampPeakRate
    displayName: 'stress_test: peak rate (req/s)'
    type: number
    default: 5000

  - name: rampSteps
    displayName: 'stress_test: number of staircase steps'
    type: number
    default: 10

  - name: rampStepDuration
    displayName: 'stress_test: duration held at each step'
    type: string
    default: '30s'

  - name: soakRate
    displayName: 'soak_test: constant rate (req/s)'
    type: number
    default: 20

  - name: soakDuration
    displayName: 'soak_test: total duration'
    type: string
    default: '5m'

  - name: spikeBaseRate
    displayName: 'spike_test: baseline rate (req/s)'
    type: number
    default: 10

  - name: spikePeakRate
    displayName: 'spike_test: peak rate during the burst (req/s)'
    type: number
    default: 300

  - name: spikeRampDuration
    displayName: 'spike_test: ramp up/down duration'
    type: string
    default: '10s'

  - name: spikeHoldDuration
    displayName: 'spike_test: duration held at peak'
    type: string
    default: '30s'

  - name: seedData
    displayName: 'Seed test data before running the test'
    type: boolean
    default: false

  - name: seedScript
    displayName: 'k6 seed script (relative to performance-tests/script/)'
    type: string
    default: 'create-activations.js'

  - name: seedExtraEnvNames
    displayName: 'Extra pipeline variables (names) passed as -e to the seed script'
    type: object
    default: []

  - name: testExtraEnvNames
    displayName: 'Extra pipeline variables (names) passed as -e to the test script'
    type: object
    default: []

  - name: extraEnv
    displayName: 'Extra plain key/value pairs passed as -e to both the seed and the test scripts'
    type: object
    default: {}

  - name: targetRequests
    displayName: 'Number of records to seed (only used when seedData=true)'
    type: number
    default: 2000

  - name: k6Version
    displayName: 'k6 version'
    type: string
    default: '2.2.0'

  - name: keyVaultName
    displayName: 'Key Vault Name'
    type: string

  - name: secretName
    displayName: 'Secret containing k6 actor credentials (JSON)'
    type: string
    default: 'k6-performance-env'

  - name: azureServiceConnection
    displayName: 'Azure Subscription'
    type: string

  - name: fetchClientCert
    displayName: 'Fetch client mTLS certificate and key from Key Vault'
    type: boolean
    default: false

  - name: clientCertSecret
    displayName: 'Client certificate secret (base64)'
    type: string
    default: 'cb-certificate'

  - name: clientKeySecret
    displayName: 'Private key secret (base64)'
    type: string
    default: 'cb-private-key'

jobs:
- job: k6_${{ parameters.appCategory }}
  displayName: '⚡ k6 ${{ parameters.appCategory }}'
  timeoutInMinutes: 90
  dependsOn: ${{ parameters.dependsOn }}
  condition: succeeded()
  strategy:
    matrix:
      ${{ each item in parameters.appsList }}:
        ${{ replace(item, '-', '_') }}:
          appName: ${{ item }}
  pool:
    name: ${{ parameters.agentPoolName }}

  steps:
    - task: AzureCLI@2
      name: fetchK6Credentials
      displayName: 'Fetch k6 actor credentials from Key Vault'
      inputs:
        azureSubscription: '${{ parameters.azureServiceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "🔐 Fetching k6 credentials secret..."
          mkdir -p $(Pipeline.Workspace)/k6-secrets

          az keyvault secret show \
            --name "${{ parameters.secretName }}" \
            --vault-name "${{ parameters.keyVaultName }}" \
            --query 'value' -o tsv > $(Pipeline.Workspace)/k6-secrets/env.json

          if ! jq empty $(Pipeline.Workspace)/k6-secrets/env.json 2>/dev/null; then
            echo "##[error]Invalid JSON format in k6 credentials secret"
            exit 1
          fi

          # Expected JSON shape:
          # { "DEBTOR_SERVICE_PROVIDER_CLIENT_ID": "...",
          #   "DEBTOR_SERVICE_PROVIDER_ID": "...",
          #   "DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET": "..." }
          # NOTE: values are stripped of any trailing/embedded newlines before
          # being registered as secret variables: a raw multi-line value would
          # only have its first line masked by ADO's log scrubber, leaking the
          # rest in plain text.
          for key in $(jq -r 'keys[]' $(Pipeline.Workspace)/k6-secrets/env.json); do
            value=$(jq -r --arg k "$key" '.[$k]' $(Pipeline.Workspace)/k6-secrets/env.json | tr -d '\r\n')
            echo "##vso[task.setvariable variable=$key;issecret=true]$value"
          done
          echo "✅ Credentials loaded as pipeline variables"

    - script: |
        rm -rf $(Pipeline.Workspace)/k6-secrets
      displayName: 'Remove plaintext credentials file from disk'
      condition: always()

    - script: |
        set -e
        echo "Installing k6 v${{ parameters.k6Version }}"
        mkdir -p $(Pipeline.Workspace)/k6-bin
        cd $(Pipeline.Workspace)/k6-bin
        wget -q -O k6.tar.gz "https://github.com/grafana/k6/releases/download/v${{ parameters.k6Version }}/k6-v${{ parameters.k6Version }}-linux-amd64.tar.gz"
        tar -xzf k6.tar.gz --strip-components=1 "k6-v${{ parameters.k6Version }}-linux-amd64/k6"
        chmod +x k6
        echo "##vso[task.prependpath]$(Pipeline.Workspace)/k6-bin"
      displayName: 'Install k6 (no sudo required)'

    - script: k6 version
      displayName: 'Verify k6 installation'

    - checkout: rtpPlatformQa
      path: 'rtp-platform-qa'
      displayName: 'Checkout rtp-platform-qa (${{ parameters.testsBranch }})'

    - ${{ if eq(parameters.fetchClientCert, true) }}:
        - task: AzureCLI@2
          name: fetchCertAndKey
          displayName: 'Fetch mTLS certificate and key from Key Vault'
          inputs:
            azureSubscription: '${{ parameters.azureServiceConnection }}'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e
              CERT_DIR="$(Pipeline.Workspace)/rtp-platform-qa/performance-tests/utils/certificates"
              mkdir -p "$CERT_DIR"
              echo "🔐 Fetching certificate and key from Key Vault..."

              # Fetch base64-encoded secrets
              cert_b64=$(az keyvault secret show \
                --name "${{ parameters.clientCertSecret }}" \
                --vault-name "${{ parameters.keyVaultName }}" \
                --query 'value' -o tsv)

              key_b64=$(az keyvault secret show \
                --name "${{ parameters.clientKeySecret }}" \
                --vault-name "${{ parameters.keyVaultName }}" \
                --query 'value' -o tsv)

              # Validate secrets
              if [ -z "$cert_b64" ]; then
                echo "❌ Error: Certificate secret '${{ parameters.clientCertSecret }}' is empty or could not be fetched from Key Vault '${{ parameters.keyVaultName }}'."
                exit 1
              fi
              if [ -z "$key_b64" ]; then
                echo "❌ Error: Key secret '${{ parameters.clientKeySecret }}' is empty or could not be fetched from Key Vault '${{ parameters.keyVaultName }}'."
                exit 1
              fi

              # Decode and write to files
              echo "$cert_b64" | base64 -d > "$CERT_DIR/cert.pem"
              echo "$key_b64"  | base64 -d > "$CERT_DIR/key-unencrypted.pem"

              chmod 600 "$CERT_DIR/key-unencrypted.pem"
              echo "✅ Certificate and key written under $CERT_DIR"

    - ${{ if eq(parameters.seedData, true) }}:
        - script: |
            set -e
            cd $(Pipeline.Workspace)/rtp-platform-qa/performance-tests
            # NOTE: create-activations.js writes always to the hardcoded path
            # json-file/rtp-activator/activations.json regardless of $(appName);
            # this mkdir matches it only while appsList == ['rtp-activator'].
            mkdir -p json-file/$(appName)
            # Optional extra variables required by some seed scripts (e.g. the
            # takeover OTP generator); empty for the other targets.
            EXTRA_ARGS=()
            for name in ${{ join(' ', parameters.seedExtraEnvNames) }}; do
              value="${!name}"
              if [ -z "$value" ] || [[ "$value" == '$('* ]]; then
                echo "##[error]Variable $name is not defined: add it to the Key Vault secret"
                exit 1
              fi
              EXTRA_ARGS+=(-e "$name=$value")
            done
            # extraEnv entries are exported with a K6_EXTRA_ prefix (see env
            # below) so they can be enumerated here without knowing their keys.
            for prefixed in $(compgen -e | grep '^K6_EXTRA_' || true); do
              value="${!prefixed}"
              if [ -n "$value" ]; then
                EXTRA_ARGS+=(-e "${prefixed#K6_EXTRA_}=$value")
              fi
            done
            k6 run "script/$SEED_SCRIPT" \
              -e ENVIRONMENT="$ENVIRONMENT" \
              -e DEBTOR_SERVICE_PROVIDER_ID="$DEBTOR_SERVICE_PROVIDER_ID" \
              -e DEBTOR_SERVICE_PROVIDER_CLIENT_ID="$DEBTOR_SERVICE_PROVIDER_CLIENT_ID" \
              -e DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET="$DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET" \
              -e TARGET_REQUESTS="$TARGET_REQUESTS" \
              "${EXTRA_ARGS[@]}"

            # Ensure resourceIds.json is reachable in script/ if created in json-file/
            if [ -f "json-file/$(appName)/resourceIds.json" ]; then
              mkdir -p script
              cp "json-file/$(appName)/resourceIds.json" script/resourceIds.json
            fi
          displayName: 'Seed test data for $(appName)'
          env:
            # Passed as real environment variables (not interpolated into the
            # script text) so that pipeline-parameter values can never be
            # interpreted as shell syntax/commands, regardless of their content.
            SEED_SCRIPT: ${{ parameters.seedScript }}
            ENVIRONMENT: ${{ parameters.env }}
            TARGET_REQUESTS: ${{ parameters.targetRequests }}
            DEBTOR_SERVICE_PROVIDER_ID: $(DEBTOR_SERVICE_PROVIDER_ID)
            DEBTOR_SERVICE_PROVIDER_CLIENT_ID: $(DEBTOR_SERVICE_PROVIDER_CLIENT_ID)
            DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET: $(DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET)
            ${{ each name in parameters.seedExtraEnvNames }}:
              ${{ name }}: $(${{ name }})
            ${{ each pair in parameters.extraEnv }}:
              K6_EXTRA_${{ pair.key }}: ${{ pair.value }}

    - script: |
        set -e
        cd $(Pipeline.Workspace)/rtp-platform-qa/performance-tests
        # Optional extra variables required by some test scripts (e.g. the
        # RTP consumer credentials and OPERATION/STATUS/PSP_TAX_CODE of the
        # GPD message test); empty for the other targets.
        EXTRA_ARGS=()
        for name in ${{ join(' ', parameters.testExtraEnvNames) }}; do
          value="${!name}"
          if [ -z "$value" ] || [[ "$value" == '$('* ]]; then
            echo "##[error]Variable $name is not defined: add it to the Key Vault secret"
            exit 1
          fi
          EXTRA_ARGS+=(-e "$name=$value")
        done
        # extraEnv entries are exported with a K6_EXTRA_ prefix (see env
        # below) so they can be enumerated here without knowing their keys.
        for prefixed in $(compgen -e | grep '^K6_EXTRA_' || true); do
          value="${!prefixed}"
          if [ -n "$value" ]; then
            EXTRA_ARGS+=(-e "${prefixed#K6_EXTRA_}=$value")
          fi
        done
        # K6_WEB_DASHBOARD_EXPORT produces a self-contained static HTML report
        # (same interactive dashboard/charts as the local `--out web-dashboard`
        # mode), instead of the live server at :5665 which is useless on a
        # headless agent. Collected as a build artifact below.
        # K6_WEB_DASHBOARD_PERIOD is lowered from the 10s default: k6 only
        # includes graphs when the run lasts > 3x this period, and short
        # smoke-test runs (a few seconds) would otherwise get an empty/skipped
        # report ("test run was short, report generation was skipped").
        K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_EXPORT=$(appName)-dashboard-report.html K6_WEB_DASHBOARD_PERIOD=500ms \
        k6 run "tests/$(appName)/$TEST_SCRIPT" \
          -e ENVIRONMENT="$ENVIRONMENT" \
          -e DEBTOR_SERVICE_PROVIDER_ID="$DEBTOR_SERVICE_PROVIDER_ID" \
          -e DEBTOR_SERVICE_PROVIDER_CLIENT_ID="$DEBTOR_SERVICE_PROVIDER_CLIENT_ID" \
          -e DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET="$DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET" \
          -e SCENARIO="$SCENARIO" \
          -e VU_COUNT_SET="$VU_COUNT_SET" \
          -e ITERATIONS="$ITERATIONS" \
          -e SLEEP_ITER="$SLEEP_ITER" \
          -e RAMP_START_RATE="$RAMP_START_RATE" \
          -e RAMP_PEAK_RATE="$RAMP_PEAK_RATE" \
          -e RAMP_STEPS="$RAMP_STEPS" \
          -e RAMP_STEP_DURATION="$RAMP_STEP_DURATION" \
          -e SOAK_RATE="$SOAK_RATE" \
          -e SOAK_DURATION="$SOAK_DURATION" \
          -e SPIKE_BASE_RATE="$SPIKE_BASE_RATE" \
          -e SPIKE_PEAK_RATE="$SPIKE_PEAK_RATE" \
          -e SPIKE_RAMP_DURATION="$SPIKE_RAMP_DURATION" \
          -e SPIKE_HOLD_DURATION="$SPIKE_HOLD_DURATION" \
          "${EXTRA_ARGS[@]}"
      displayName: 'Run k6 test: $(appName)/${{ parameters.testScript }}'
      env:
        TEST_SCRIPT: ${{ parameters.testScript }}
        ENVIRONMENT: ${{ parameters.env }}
        SCENARIO: ${{ parameters.scenario }}
        VU_COUNT_SET: ${{ parameters.vuCount }}
        ITERATIONS: ${{ parameters.iterations }}
        SLEEP_ITER: ${{ parameters.sleepIter }}
        RAMP_START_RATE: ${{ parameters.rampStartRate }}
        RAMP_PEAK_RATE: ${{ parameters.rampPeakRate }}
        RAMP_STEPS: ${{ parameters.rampSteps }}
        RAMP_STEP_DURATION: ${{ parameters.rampStepDuration }}
        SOAK_RATE: ${{ parameters.soakRate }}
        SOAK_DURATION: ${{ parameters.soakDuration }}
        SPIKE_BASE_RATE: ${{ parameters.spikeBaseRate }}
        SPIKE_PEAK_RATE: ${{ parameters.spikePeakRate }}
        SPIKE_RAMP_DURATION: ${{ parameters.spikeRampDuration }}
        SPIKE_HOLD_DURATION: ${{ parameters.spikeHoldDuration }}
        DEBTOR_SERVICE_PROVIDER_ID: $(DEBTOR_SERVICE_PROVIDER_ID)
        DEBTOR_SERVICE_PROVIDER_CLIENT_ID: $(DEBTOR_SERVICE_PROVIDER_CLIENT_ID)
        DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET: $(DEBTOR_SERVICE_PROVIDER_CLIENT_SECRET)
        ${{ each name in parameters.testExtraEnvNames }}:
          ${{ name }}: $(${{ name }})
        ${{ each pair in parameters.extraEnv }}:
          K6_EXTRA_${{ pair.key }}: ${{ pair.value }}

    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/k6-results/$(appName)"
        cp $(Pipeline.Workspace)/rtp-platform-qa/performance-tests/*-report.txt "$(Build.ArtifactStagingDirectory)/k6-results/$(appName)/" 2>/dev/null || true
        cp $(Pipeline.Workspace)/rtp-platform-qa/performance-tests/*-stress-analysis.json "$(Build.ArtifactStagingDirectory)/k6-results/$(appName)/" 2>/dev/null || true
        cp $(Pipeline.Workspace)/rtp-platform-qa/performance-tests/*-dashboard-report.html "$(Build.ArtifactStagingDirectory)/k6-results/$(appName)/" 2>/dev/null || true
      displayName: 'Collect k6 test artifacts'
      condition: always()

    - publish: '$(Build.ArtifactStagingDirectory)/k6-results'
      displayName: 'Publish k6 test results'
      artifact: 'k6TestResults_$(appName)'
      condition: always()
